# Ghostty configuration

# --- Theme ---
# Ghostty ships Catppuccin built in; run `ghostty +list-themes` to browse.
# Dark flavours: "Catppuccin Mocha" (darkest), "Catppuccin Macchiato", "Catppuccin Frappe".
# Theme names are the literal filenames in /usr/share/ghostty/themes/ - capitals and spaces included.
theme = Catppuccin Macchiato

# --- Font ---
font-family = JetBrainsMono Nerd Font
font-size = 11

# --- Window ---
background-opacity = 0.98
window-decoration = none
window-padding-x = 0
window-padding-y = 0
maximize = true

# --- Behaviour ---
copy-on-select = clipboard
confirm-close-surface = false
