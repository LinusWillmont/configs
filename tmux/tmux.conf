bind r source-file ~/.tmux.conf \; display-message "RELOADING CONFIGURATION FILE..."

#remap prefix to 'C-space'
#unbind C-b
#set -g prefix C-space
#bind C-space send-prefix

#Yank with Y to sys clipboard (Wayland: wl-copy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

set-window-option -g mode-keys vi
set -g mouse on

# Truecolor. Ghostty reports TERM=xterm-ghostty, so match every outer terminal
# rather than just xterm-256color - catppuccin needs RGB to render correctly.
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# ---------------------------------------------------------------------------
# STATUS LINE - Catppuccin Macchiato
# ---------------------------------------------------------------------------
# base #24273a  mantle #1e2030  crust  #181926  surface0 #363a4f
# text #cad3f5  overlay0 #6e738d  mauve #c6a0f6  blue #8aadf4  green #a6da95

set -g status on
set -g status-interval 1
set -g status-justify centre

# Normal: mantle background. With the prefix held: mauve, so it's obvious.
set -g status-style '#{?client_prefix,bg=#c6a0f6#,fg=#181926,bg=#1e2030#,fg=#cad3f5}'

#Highlight the current window in status bar
setw -g window-status-current-style '#{?client_prefix,bg=#181926#,fg=#c6a0f6,bg=#8aadf4#,fg=#181926}'
setw -g window-status-style 'bg=default,fg=#6e738d'
# #F = window flags: Z zoomed, * current, - last, # activity, ! bell, ~ silence.
# Current window is already colour-highlighted, so drop its redundant '*'.
# Space lives inside the true branch, so there's no trailing gap when unflagged.
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-format ' #I:#W#{?window_flags, #F,} '

# Left Status
set -g status-left-length 100
set -g status-left-style default
set -g status-left "[#S]"

# Right Status
set -g status-right-length 100
set -g status-right-style default
set -g status-right "#h #(free -m -h | awk '/Mem/{printf $3 \"\/\"$2}') #(date +%H:%M)"

# Panes
set -g pane-active-border-style "bg=default fg=#c6a0f6"
set -g pane-border-style "bg=default fg=#363a4f"

# Messages / command prompt
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g mode-style "bg=#363a4f,fg=#cad3f5"

# Nvim recommended configs
set-option -sg escape-time 10
set-option -g focus-events on

# List of plugins
#set -g @plugin 'catppuccin/tmux'
#set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Guarded: tpm is not installed, and an unguarded `run` errors on every start.
# To use it: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
